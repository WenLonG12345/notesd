[tools]
go = "1.27.1"
node = "24.21.0"
pnpm = "10.18.1"
watchexec = "2.8.0"
golangci-lint = "2.14.0"
java = "temurin-21.0.12+8.0.LTS"

[env]
# Static, cgo-free binaries; test:go turns cgo back on for -race.
CGO_ENABLED = "0"
# Android Studio's default SDK location on macOS; set ANDROID_HOME to override.
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Library/Android/sdk') }}"

[tasks.install]
description = "Install web dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Go server (rebuilt on change) + Vite, at http://localhost:5173"
depends = ["dev:server", "dev:web"]

[tasks."dev:server"]
description = "Go server on :8080, rebuilt and restarted on .go/.sql changes"
dir = "server"
run = "watchexec --restart --watch . --exts go,sql --ignore internal/web/dist -- sh ../scripts/dev-server.sh"

[tasks."dev:web"]
description = "Vite dev server, proxying the API to :8080"
dir = "apps/web"
depends = ["install"]
run = "pnpm dev"

[tasks."dev:reset"]
description = "Delete the dev database; the next dev:server run seeds it again"
dir = "server"
run = "rm -rf ${NOTESD_DATA_DIR:-data}"

[tasks.check]
description = "Lint, typecheck and test everything"
depends = ["lint", "typecheck", "test"]

[tasks.lint]
depends = ["lint:go", "lint:web"]

[tasks."lint:go"]
dir = "server"
run = "golangci-lint run ./..."

[tasks."lint:web"]
dir = "apps/web"
depends = ["install"]
run = "pnpm lint"

[tasks.typecheck]
dir = "apps/web"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
depends = ["test:go", "test:web"]

[tasks."test:go"]
dir = "server"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks."test:web"]
dir = "apps/web"
depends = ["install"]
run = "pnpm test"

[tasks."test:android"]
description = "Android unit tests (JVM and Robolectric); emulator tests stay manual"
dir = "apps/android"
run = "./gradlew :core:test :app:testDebugUnitTest"

[tasks."lint:android"]
dir = "apps/android"
run = "./gradlew ktlintCheck :app:lintDebug"

[tasks."screenshots:android"]
description = "Render every Android screen to apps/android/app/build/screenshots for design review"
dir = "apps/android"
run = "./gradlew :app:testDebugUnitTest --tests notes.app.ScreenshotTest -Pnotes.screenshots --rerun"

[tasks."build:android"]
description = "Debug APK in apps/android/app/build/outputs/apk/debug"
dir = "apps/android"
run = "./gradlew :app:assembleDebug"

[tasks."build:web"]
description = "Build the web app into server/internal/web/dist"
dir = "apps/web"
depends = ["install"]
run = "pnpm build"

[tasks.build]
description = "server/bin/notesd with the web app embedded"
dir = "server"
depends = ["build:web"]
run = "go build -trimpath -ldflags \"-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o bin/notesd ./cmd/notesd"

[tasks.release]
description = "linux/amd64 and linux/arm64 binaries in server/bin"
dir = "server"
depends = ["build:web"]
run = """
ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
for arch in amd64 arm64; do
  GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o bin/notesd-linux-$arch ./cmd/notesd
done
"""

[tasks.clean]
dir = "server"
run = "rm -rf bin"
