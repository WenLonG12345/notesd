version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - rowserrcheck
  settings:
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000", "-ST1003"]
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
formatters:
  enable:
    - gofmt
